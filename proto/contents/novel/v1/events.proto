syntax = "proto3";
package contents.novel.v1;

import "contents/novel/v1/novel.proto";
import "google/protobuf/any.proto";
import "google/protobuf/timestamp.proto";
import "ulid/ulid.proto";

option go_package = "contents/novel/v1";

message Event {
  map<string, string> headers = 1;
  ulid.ULID id = 10;
  ulid.ULID aggregate_id = 11;
  google.protobuf.Timestamp emit_at = 12;
  string kind = 13;
  string aggregate_kind = 14;
  google.protobuf.Any payload = 15;
}

message NovelCreatedPayload {
  ulid.ULID author_id = 1;
  string title = 2;
  string description = 3;
  repeated string tags = 4;
  string category = 5;
}

message NewChapterUploaded {
  Novel.Chapter payload = 1;
}
